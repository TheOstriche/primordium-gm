<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16130f">
<title>Primordium Tools</title>
<style>
  :root {
    --bg: #16130f; --panel: #211d17; --line: #3b342a; --text: #ece4d4; --muted: #a89c87; --accent: #c99a4a;
    --serif: "Times New Roman", Georgia, "Book Antiqua", serif;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans);
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 560px; }
  h1 { font: normal 34px var(--serif); letter-spacing: .02em; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--muted); text-align: center; margin: 0 0 28px; }
  a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 18px 20px; margin-bottom: 14px; color: inherit; text-decoration: none; }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
  a.card h2 { font: normal 22px var(--serif); color: var(--accent); margin: 0 0 4px; }
  a.card p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Primordium 2.0</h1>
  <p class="sub">Tools for the table</p>
  <a class="card" href="sheet/">
    <h2>Character Sheet</h2>
    <p>For players. Track your character on your phone, even offline.</p>
  </a>
  <a class="card" href="gm/">
    <h2>GM Tool</h2>
    <p>For the GM. Build encounters and run combat on a laptop.</p>
  </a>
</main>
</body>
</html>
